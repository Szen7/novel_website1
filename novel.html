<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nocturne</title>
<meta name="description" content="Read original web novels for free, or create an account to publish your own.">
<meta property="og:title" content="Nocturne">
<meta property="og:description" content="Read original web novels for free, or publish your own.">
<meta name="theme-color" content="#060913">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--a:#38bdf8;--b:#34d399;--g:rgba(56,189,248,.3);--s:rgba(56,189,248,.14);--t:#7dd3fc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#060913;scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:#e2e8f0;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#060913;z-index:35}
#cv{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
main{pointer-events:none}
.gl{pointer-events:auto;background:rgba(10,15,28,.62);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.card{transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-3px);border-color:var(--a)}
.btn{background:linear-gradient(135deg,var(--a),var(--b));color:#04101e;font-weight:600;border-radius:.75rem}.btn:hover{filter:brightness(1.1)}
.gh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:.75rem}.gh:hover{background:rgba(255,255,255,.14)}
.chip{background:var(--s);border:1px solid var(--g);color:var(--t);border-radius:9999px;padding:.1rem .6rem;font-size:10px;font-weight:600}
.pill{padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#cbd5e1}.pill:hover{background:rgba(255,255,255,.1)}
.tb{padding:.35rem .75rem;border-radius:.75rem;font-size:.75rem;font-weight:500;color:#cbd5e1;border:1px solid transparent}.tb:hover{color:#fff}
.on{background:var(--s)!important;border-color:var(--a)!important;color:#fff}
.in{width:100%;background:rgba(5,9,20,.6);border:1px solid rgba(255,255,255,.14);border-radius:.75rem;padding:.55rem .85rem;font-size:.85rem;outline:none;color:#f1f5f9}.in:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--g)}
select.in{background:#0b1020}textarea.in{resize:vertical}
label,.lb{display:block;font-size:11px;font-weight:500;color:#cbd5e1}
.cover{position:relative;overflow:hidden;border-radius:.5rem .8rem .8rem .5rem;box-shadow:-3px 6px 16px rgba(0,0,0,.55)}
.cover:before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.18),rgba(0,0,0,.25))}
.hid{display:none!important}
.rd{--bg:#000;--fg:#d4d4d4;--mu:#737373;--ln:#262626;background:var(--bg);color:var(--fg)}
.rd[data-t=light]{--bg:#fff;--fg:#1c1c1c;--ln:#e5e5e5}
.rd .ln{border-color:var(--ln)}.rd .mu{color:var(--mu)}
.rd .gh{background:transparent;border-color:var(--ln);color:var(--fg)}.rd .gh:hover{background:var(--ln)}
.rd .gh.on{background:var(--fg)!important;color:var(--bg)}
.rd .in{background:var(--bg);color:var(--fg);border-color:var(--ln)}
.rd button:disabled{opacity:.35;pointer-events:none}
.rd.fc .bar{display:none}
.serif{font-family:Lora,Georgia,serif}.sans{font-family:Inter,sans-serif}
#rB{line-height:1.85}#rB>*+*{margin-top:1.25rem}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="ts" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] gl rounded-full px-4 py-2 text-xs transition-opacity" style="opacity:0;pointer-events:none"></div>

<header class="sticky z-30 px-3 sm:px-6 pt-3 pointer-events-none" style="top:env(safe-area-inset-top,0px)">
<nav class="gl max-w-[1120px] mx-auto rounded-2xl px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2">
<button data-tab="explore" class="flex items-center gap-2.5">
<span class="w-9 h-9 rounded-xl grid place-items-center border" style="background:var(--s);border-color:var(--g)"><svg class="w-5 h-5" style="color:var(--t)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19.5 4.5c-2.8.4-5.2 2.4-6.5 5.2L11.5 13l3.3-1.5c2.8-1.3 4.8-3.7 5.2-6.5Z"/></svg></span>
<span class="text-lg font-bold tracking-tight text-white">Nocturne</span></button>
<div class="flex gap-1"><button data-tab="explore" class="tb">Explore</button><button data-tab="shelf" class="tb">My Shelf <span id="sc" class="ml-1 px-1.5 rounded-full bg-white/10 text-[10px]">0</span></button><button data-tab="mine" id="tm" class="tb hid">My Works</button></div>
<div class="ml-auto flex items-center gap-2">
<button id="mo" class="gh px-3 py-1.5 text-xs" title="Change the scene">Night</button>
<button data-w class="gh px-3 py-1.5 text-xs">Write</button>
<div id="gu" class="flex items-center gap-2"><button id="si" class="px-2 text-xs text-slate-300 hover:text-white">Sign in</button><button id="su" class="btn px-3 py-1.5 text-xs">Create account</button></div>
<div id="us" class="hid flex items-center gap-2"><span id="ua" class="w-6 h-6 rounded-full grid place-items-center text-[11px] font-bold text-slate-950" style="background:var(--a)"></span><span id="un" class="text-xs max-w-[100px] truncate"></span><button id="so" class="gh px-3 py-1.5 text-xs">Sign out</button></div>
</div></nav></header>

<main class="relative z-10 max-w-[1120px] mx-auto px-3 sm:px-6 pt-5 pb-16">
<section id="hero" class="gl rounded-3xl p-6 sm:p-8 mb-5"></section>
<section class="gl rounded-2xl p-3 mb-5 flex flex-col gap-3">
<div class="flex flex-wrap gap-2"><input id="q" type="search" class="in flex-1 min-w-[180px] !rounded-full" placeholder="Search title, author, genre or synopsis"><select id="sr" class="in !w-auto"><option value="new">Newest</option><option value="top">Most applauded</option></select></div>
<div id="gp" class="flex flex-wrap gap-1.5"></div></section>
<section id="gd" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
<div id="lm" class="hid text-center mt-5"><button class="gl rounded-xl px-5 py-2 text-xs">Show more stories</button></div>
<div id="em" class="hid gl rounded-3xl p-8 text-center max-w-md mx-auto mt-4"><h2 id="eh" class="font-semibold text-white"></h2><p id="ep" class="text-xs text-slate-400 mt-1.5"></p><button data-w class="btn px-5 py-2 text-xs mt-4">Write a story</button></div>
</main>

<div id="au" class="hid fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm"><div class="gl rounded-3xl w-full max-w-[380px] p-6" style="background:rgba(11,16,29,.94)">
<div class="flex justify-between items-start gap-3"><div><h2 id="ah" class="text-xl font-bold text-white"></h2><p id="an" class="text-xs text-slate-400 mt-1"></p></div><button id="ax" class="gh px-2.5 py-1 text-xs">Close</button></div>
<div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-black/35 my-4"><button data-m="in" class="tb">Sign in</button><button data-m="up" class="tb">Create account</button></div>
<p id="ae" class="hid text-xs text-rose-200 bg-rose-500/15 border border-rose-400/30 rounded-xl px-3 py-2 mb-3"></p>
<form id="af" class="flex flex-col gap-3" novalidate><input id="aN" class="in" placeholder="Pen name" autocomplete="nickname"><input id="aE" type="email" class="in" placeholder="Email" autocomplete="email"><input id="aP" type="password" class="in" placeholder="Password (8+ characters)"><button id="ab" class="btn py-2.5 text-sm"></button></form>
<button id="ag" class="block mx-auto mt-4 text-xs text-slate-400 hover:text-white">Keep reading as a guest</button></div></div>

<div id="ed" class="hid fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-5 bg-black/65 backdrop-blur-sm"><form id="ef" class="gl rounded-3xl w-full max-w-3xl max-h-[94vh] flex flex-col overflow-hidden" style="background:rgba(11,16,29,.94)" novalidate>
<div class="px-5 py-3.5 border-b border-white/10 flex items-center justify-between"><h2 id="eH" class="font-bold text-white"></h2><button type="button" id="eX" class="gh px-3 py-1.5 text-xs">Close</button></div>
<div class="ov flex-1 min-h-0 overflow-y-auto p-5 flex flex-col gap-4">
<p id="eE" class="hid text-xs text-rose-200 bg-rose-500/15 border border-rose-400/30 rounded-xl px-3 py-2"></p>
<div><label for="eT">Title</label><input id="eT" class="in mt-1" placeholder="Whispers Beneath the Silver Pine"></div>
<div><span class="lb">Genres (choose as many as fit)</span><div id="eG" class="flex flex-wrap gap-1.5 mt-1.5"></div><input id="eN" class="in mt-2 !w-56" placeholder="Add your own genre, press Enter"></div>
<div><label for="eS">Synopsis</label><textarea id="eS" rows="4" class="in mt-1" placeholder="A hook that invites readers in. Write as much as you need."></textarea></div>
<div><span class="lb">Cover</span><div id="eK" class="flex gap-2 mt-1.5"></div></div>
<div class="flex items-center gap-2"><input id="eP" type="checkbox" class="accent-sky-400"><label for="eP" style="display:inline;cursor:pointer">Save as a draft (only you can see it)</label></div>
<div class="border-t border-white/10 pt-4"><span class="lb mb-1.5">Chapters</span><div id="eC" class="flex flex-wrap gap-1.5"></div>
<input id="cT" class="in mt-3" placeholder="Chapter title"><textarea id="cC" rows="12" class="in mt-2 leading-relaxed" placeholder="Write your chapter. Separate paragraphs with a new line."></textarea>
<div class="flex justify-between mt-1.5 text-[11px]"><span id="eW" style="color:var(--t)"></span><button type="button" id="cD" class="text-rose-300 hover:underline">Delete this chapter</button></div></div></div>
<div class="px-5 py-3 border-t border-white/10 flex justify-end gap-2"><button type="button" id="eY" class="gh px-4 py-2 text-xs">Cancel</button><button class="btn px-5 py-2 text-sm">Save and publish</button></div></form></div>

<div id="rd" class="rd hid fixed inset-0 z-40 flex flex-col" data-t="dark">
<div id="pb" class="absolute top-0 left-0 h-0.5 z-10" style="background:var(--a);width:0"></div>
<div class="bar ln border-b px-3 sm:px-6 py-2.5 flex items-center gap-2"><button id="rX" class="gh px-3 py-1.5 text-xs">Close</button><div class="min-w-0 flex-1"><p id="rT" class="text-sm font-semibold truncate"></p><p id="rA" class="text-[11px] mu truncate"></p></div><select id="rC" class="in !w-auto max-w-[42vw] !py-1.5 text-xs"></select></div>
<div class="bar ln border-b px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
<div class="flex gap-1"><button data-f="serif" class="gh px-2.5 py-1">Serif</button><button data-f="sans" class="gh px-2.5 py-1">Sans</button></div>
<div class="flex items-center gap-1"><button id="fm" class="gh px-2.5 py-1">A-</button><span id="fs" class="w-10 text-center mu"></span><button id="fp" class="gh px-2.5 py-1">A+</button></div>
<div class="flex gap-1"><button data-th="dark" class="gh px-2.5 py-1">Black</button><button data-th="light" class="gh px-2.5 py-1">White</button></div>
<button id="fc" class="gh px-2.5 py-1">Focus</button></div>
<div id="rS" class="flex-1 min-h-0 overflow-y-auto px-5 sm:px-10 py-8"><article class="max-w-[66ch] mx-auto"><div id="rY"></div><p id="rN" class="text-xs font-semibold uppercase tracking-widest mu mb-1.5"></p><h2 id="rH" class="text-2xl font-bold mb-6 leading-snug"></h2><div id="rB"></div><div class="h-16"></div></article></div>
<div class="bar ln border-t px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2"><div class="flex gap-2"><button id="pv" class="gh px-3 py-1.5 text-xs">Previous</button><button id="nx" class="gh px-3 py-1.5 text-xs">Next</button></div><button id="ap" class="gh px-3.5 py-1.5 text-xs"></button></div>
<button id="uf" class="hid fixed top-3 right-3 gh px-3 py-1.5 text-xs opacity-40 hover:opacity-100">Exit focus</button></div>

<script>
(()=>{'use strict';
const $=i=>document.getElementById(i),show=(e,on=true)=>e.classList.toggle('hid',!on),cl=e=>show(e,false),rnd=Math.random;
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('nx:'+k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem('nx:'+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),wc=s=>(s.match(/\S+/g)||[]).length;
/* ---------- data layer: swap these stores for a real backend later ---------- */
const GEN=['Fantasy','Sci-Fi','Romance','Mystery','Slice of Life','Horror','Adventure','Drama','Thriller','Historical','Comedy','Action'];
const COV=['linear-gradient(155deg,#091326,#164e63 54%,#059669)','linear-gradient(155deg,#1f1135,#9d174d 52%,#ea580c)','linear-gradient(155deg,#0f0c29,#302b63 55%,#6d28d9)','linear-gradient(155deg,#1e1b4b,#831843 54%,#e11d48)','linear-gradient(155deg,#090d16,#1e293b 52%,#b45309)','linear-gradient(155deg,#0c192c,#1d4ed8 54%,#38bdf8)'];
let users=ld('users',[]),novels=ld('novels',[]),shelf=ld('shelf',[]),prog=ld('prog',{}),liked=ld('liked',[]),rs=Object.assign({font:'serif',size:18,theme:'dark'},ld('rs',{})),me=users.find(u=>u.id===ld('me',''))||null;
let tab='explore',genre='All',sort='new',q='',feat=null,arm=null,pend=false,lim=12;
const words=n=>n.chapters.reduce((s,c)=>s+wc(c.content),0),mins=n=>Math.max(1,Math.round(words(n)/200));
const live=()=>novels.filter(n=>!n.draft),pool=()=>tab==='mine'?novels.filter(n=>me&&n.owner===me.id):live();
const pick=()=>{const v=live(),o=v.filter(n=>n.id!==feat),l=o.length?o:v;feat=l.length?l[Math.floor(rnd()*l.length)].id:null};
const cover=(n,c,a='')=>`<div class="cover ${c}" ${a} style="background:${esc(n.cover)}"><div class="relative z-10 h-full flex flex-col justify-between p-2.5 pl-4"><span class="text-[8px] uppercase tracking-widest text-white/80 truncate">${esc(n.genres[0])}</span><div><p class="text-[11px] font-bold text-white leading-tight line-clamp-3">${esc(n.title)}</p><p class="text-[8px] text-white/70 truncate mt-1">${esc(n.author)}</p></div></div></div>`;
const chips=(n,m=3)=>n.genres.slice(0,m).map(g=>`<span class="chip">${esc(g)}</span>`).join('')+(n.genres.length>m?`<span class="chip">+${n.genres.length-m}</span>`:'');
const rl=n=>prog[n.id]>0?'Continue, chapter '+(prog[n.id]+1):'Read now';
function toast(m){const t=$('ts');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,3000)}
/* ---------- catalog ---------- */
function hdr(){show($('gu'),!me);show($('us'),!!me);show($('tm'),!!me);if(me){$('un').textContent=me.name;$('ua').textContent=me.name[0].toUpperCase()}$('sc').textContent=shelf.length;document.querySelectorAll('.tb[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))}
function hero(){const h=$('hero'),n=live().find(x=>x.id===feat);
if(!n){h.innerHTML='<h1 class="text-2xl sm:text-3xl font-bold text-white">The library is waiting for its first story</h1><p class="text-slate-300 mt-2 max-w-xl text-sm">Readers can browse freely without an account. Writers can create one and publish a novel in minutes.</p><button data-w class="btn px-5 py-2.5 text-sm mt-5">Write a story</button>';return}
h.innerHTML=`<div class="flex gap-5 sm:gap-7 items-start">${cover(n,'hidden sm:block w-36 h-52 shrink-0')}<div class="min-w-0"><div class="flex flex-wrap gap-1.5 mb-3">${chips(n,6)}</div><h1 class="text-2xl sm:text-4xl font-bold text-white leading-tight">${esc(n.title)}</h1><p class="text-sm text-slate-400 mt-1">by <button data-au="${esc(n.author)}" class="text-slate-200 hover:underline">${esc(n.author)}</button></p><p class="text-sm sm:text-base text-slate-300 mt-4 leading-relaxed line-clamp-5 whitespace-pre-line">${esc(n.synopsis)}</p><div class="flex flex-wrap gap-2.5 mt-5"><button data-read="${n.id}" class="btn px-5 py-2.5 text-sm">${rl(n)}</button>${live().length>1?'<button data-shuf class="gh px-4 py-2.5 text-sm">Another story</button>':''}</div><p class="text-xs text-slate-400 mt-4">${n.chapters.length} chapters &middot; ${mins(n)} min read &middot; ${n.likes} applause</p></div></div>`}
function pills(){const gs=['All',...new Set(pool().flatMap(n=>n.genres))];if(!gs.includes(genre))genre='All';show($('gp'),gs.length>2);$('gp').innerHTML=gs.map(g=>`<button data-g="${esc(g)}" class="pill ${g===genre?'on':''}">${esc(g)}</button>`).join('')}
function card(n){const mine=tab==='mine',b=shelf.includes(n.id),ar=arm===n.id;
return `<article class="gl card rounded-2xl p-4 flex flex-col gap-3"><div class="flex gap-3.5">${cover(n,'w-24 h-36 shrink-0 cursor-pointer','data-read="'+n.id+'"')}<div class="min-w-0 flex-1 flex flex-col"><div class="flex flex-wrap gap-1 mb-1.5">${n.draft?'<span class="chip" style="color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.12)">Draft</span>':''}${chips(n)}</div><h3 data-read="${n.id}" class="font-bold text-white leading-snug cursor-pointer hover:underline line-clamp-2">${esc(n.title)}</h3><p class="text-xs text-slate-400 mt-0.5 truncate">by <button data-au="${esc(n.author)}" class="hover:text-white hover:underline">${esc(n.author)}</button></p><p class="text-xs text-slate-300/85 mt-2 line-clamp-3 leading-relaxed">${esc(n.synopsis)}</p><p class="mt-auto pt-2 text-[11px] text-slate-400">${n.chapters.length} ch &middot; ${mins(n)} min &middot; ${n.likes} applause</p></div></div><div class="flex gap-2 pt-3 border-t border-white/10"><button data-read="${n.id}" class="btn flex-1 py-2 text-xs">${rl(n)}</button>${mine?`<button data-edit="${n.id}" class="gh px-3 py-2 text-xs">Edit</button><button data-del="${n.id}" class="gh px-3 py-2 text-xs ${ar?'text-rose-300':''}">${ar?'Confirm':'Delete'}</button>`:`<button data-bm="${n.id}" class="gh px-3 py-2 text-xs ${b?'on':''}">${b?'Saved':'Bookmark'}</button>`}</div></article>`}
function grid(){const sg=[tab,genre,q,sort].join('|');if(sg!==grid.s){lim=12;grid.s=sg}let l=pool().filter(n=>(tab!=='shelf'||shelf.includes(n.id))&&(genre==='All'||n.genres.includes(genre))&&(!q||(n.title+' '+n.author+' '+n.synopsis+' '+n.genres.join(' ')).toLowerCase().includes(q)));
l=sort==='top'?l.sort((a,b)=>b.likes-a.likes):l.sort((a,b)=>b.created-a.created);
$('gd').innerHTML=l.slice(0,lim).map(card).join('');show($('lm'),l.length>lim);show($('em'),!l.length);
if(!l.length){const t=tab==='shelf'?['Your shelf is empty','Bookmark a story and it will wait for you here. No account needed.']:tab==='mine'?['Nothing published yet','Start your first novel and it will appear here, ready to edit.']:!live().length?['No stories yet','Be the first: create an account and publish a novel.']:['No stories match','Try a different search or genre.'];$('eh').textContent=t[0];$('ep').textContent=t[1]}}
function render(){hdr();hero();pills();grid()}
function bm(id){const i=shelf.indexOf(id);i<0?shelf.push(id):shelf.splice(i,1);sv('shelf',shelf);toast(i<0?'Saved to My Shelf':'Removed from My Shelf');render()}
function del(id){if(arm!==id){arm=id;grid();setTimeout(()=>{if(arm===id){arm=null;grid()}},3000);return}arm=null;novels=novels.filter(n=>n.id!==id||n.owner!==me.id);shelf=shelf.filter(x=>x!==id);delete prog[id];sv('novels',novels);sv('shelf',shelf);sv('prog',prog);if(feat===id)pick();render();toast('Novel deleted')}
const wr=()=>{if(me)openEd();else{pend=true;openA('up','Create an account to publish and manage your stories. Reading stays free for everyone.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-read],[data-bm],[data-edit],[data-del],[data-shuf],[data-w],[data-tab],[data-g],[data-au]');if(!t)return;const d=t.dataset;
if(d.read)openR(d.read);else if(d.bm)bm(d.bm);else if(d.edit)openEd(d.edit);else if(d.del)del(d.del);else if(d.shuf!==undefined){pick();hero()}else if(d.w!==undefined)wr();else if(d.tab){tab=d.tab;render();scrollTo({top:0,behavior:'smooth'})}else if(d.g){genre=d.g;render()}else if(d.au){q=d.au.toLowerCase();$('q').value=d.au;tab='explore';genre='All';render();scrollTo({top:0,behavior:'smooth'})}});
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();grid()};$('sr').onchange=e=>{sort=e.target.value;grid()};$('lm').onclick=()=>{lim+=12;grid()};
